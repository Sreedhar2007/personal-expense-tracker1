{% extends "base.html" %}

{% block title %}Register - Personal Expense Tracker{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">📝</div>
            <h2>Create an Account</h2>
            <p class="auth-subtitle">Join today to start tracking your finances</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST" class="auth-form" autocomplete="off">
            <!-- Username -->
            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-control" 
                        placeholder="e.g. rahul_sharma" 
                        value="{{ username or '' }}" 
                        minlength="3" 
                        autocapitalize="none"
                        autocorrect="off"
                        required 
                        autofocus
                    >
                </div>
                <small class="form-help">Minimum 3 characters, letters and numbers.</small>
            </div>

            <!-- Email Address -->
            <div class="form-group">
                <label for="email" class="form-label">Email Address</label>
                <div class="input-wrapper">
                    <span class="input-icon">✉️</span>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        class="form-control" 
                        placeholder="e.g. rahul@example.com" 
                        value="{{ email or '' }}" 
                        autocapitalize="none"
                        autocorrect="off"
                        required
                    >
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password" class="form-label">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        class="form-control" 
                        placeholder="Minimum 6 characters" 
                        minlength="6" 
                        required
                    >
                    <button type="button" class="btn-toggle-password" onclick="togglePasswordVisibility('password', this)">
                        👁️
                    </button>
                </div>
            </div>

            <!-- Confirm Password -->
            <div class="form-group">
                <label for="confirm_password" class="form-label">Confirm Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔒</span>
                    <input 
                        type="password" 
                        id="confirm_password" 
                        name="confirm_password" 
                        class="form-control" 
                        placeholder="Re-enter password" 
                        minlength="6" 
                        required
                    >
                </div>
            </div>

            <!-- Submit Button -->
            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-block btn-lg">
                    Create Account
                </button>
            </div>
        </form>

        <div class="auth-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}" class="auth-link">Log In</a></p>
        </div>
    </div>
</div>
{% endblock %}
